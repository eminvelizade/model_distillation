# Pinned environment for RF-DETR Nano <- DINOv3 ViT-L/16 distillation (LightlyTrain).
# Python 3.11 (LightlyTrain docs warn about RF-DETR on 3.12+).
# PyTorch 2.8.0 + CUDA 12.6 runtime bundled in the pip wheels (nvidia-* packages); no system CUDA toolkit needed.
# NVIDIA driver: >= 560.35 recommended (native CUDA 12.6); >= 525.60.13 is the floor under CUDA 12 minor-version
# compatibility. RTX 4090 (sm_89) and RTX A6000 (sm_86) are both covered by the cu126 wheels.
# pip pins were generated with:
#   uv pip compile requirements.in --python-version 3.11 --python-platform x86_64-manylinux_2_28 \
#     --extra-index-url https://download.pytorch.org/whl/cu126 --index-strategy unsafe-best-match
#   requirements.in: torch==2.8.0+cu126 torchvision==0.23.0+cu126 lightly-train[rfdetr]==0.17.0 rfdetr==1.5.2 scikit-learn
name: rfdetr-distill
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11.14
  - pip=26.1.2
  - conda-pack=0.9.2
